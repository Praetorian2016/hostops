<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostOps - Gestione Operativa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 48px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 90%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HostOps</h1>
        <p>Piattaforma centralizzata per la gestione e l'automazione delle tue operazioni di accoglienza.</p>
        
        <div class="actions">
            <a href="/login" class="btn btn-primary">Accedi al tuo account</a>
            <a href="/register" class="btn btn-secondary">Crea un nuovo account</a>
        </div>
    </div>
</body>
</html>
